<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mockup</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #15161a;
    color: #eee;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .navbar {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    background: #1c1d22;
    padding: 0.6rem 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .navbar .brand { font-weight: 700; letter-spacing: 0.02em; margin-right: auto; opacity: 0.85; }
  .navbar .icon-btn {
    background: none; border: none; color: #ccc; font-size: 1.1rem; cursor: pointer;
  }
  .navbar .icon-btn.active { color: #f5c518; }

  .section-label {
    padding: 1rem 1.2rem 0.3rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.5;
  }

  .grid { display: flex; gap: 0.9rem; padding: 0.6rem 1.2rem 1.4rem; flex-wrap: wrap; }
  .card {
    width: 220px;
    border-radius: 8px;
    overflow: hidden;
    background: #1e2026;
  }
  .card .thumb-wrap { position: relative; }
  .card .thumb {
    height: 124px;
    background: linear-gradient(135deg, #3a3f52, #23262f);
  }
  .card .thumb.alt { background: linear-gradient(135deg, #4a3f2f, #23262f); }
  .card .thumb.alt3 { background: linear-gradient(135deg, #2f4a3f, #23262f); }
  .card .meta { padding: 0.5rem 0.6rem; font-size: 0.8rem; opacity: 0.85; }

  /* --- exact classes from watchlater.css --- */
  .watch-later-overlay { position: absolute; bottom: 0.4rem; left: 0.4rem; z-index: 5; }
  .watch-later-btn {
    background: rgba(0,0,0,0.55) !important;
    border: none !important;
    color: rgba(255,255,255,0.75) !important;
    border-radius: 4px;
    padding: 0.2rem 0.5rem !important;
    line-height: 1;
    font-size: 0.95rem;
  }
  .watch-later-btn.watch-later-on { color: #f5c518 !important; }

  .watchlater-page { padding: 1.2rem 1.4rem; max-width: 640px; }
  .watchlater-page-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
  }
  .watchlater-page-header h3 { margin: 0; }
  .watchlater-kofi-link {
    font-size: 0.85rem; opacity: 0.8; text-decoration: none; color: inherit;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    padding: 0.25rem 0.75rem; white-space: nowrap;
  }
  .watchlater-list { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 1rem; }
  .watchlater-row {
    background: rgba(255,255,255,0.04); border-radius: 6px;
    display: flex; align-items: center; gap: 0.8rem; padding: 0.4rem 0.7rem;
  }
  .watchlater-row-thumb-link { position: relative; display: block; flex: 0 0 auto; }
  .watchlater-row-thumb {
    width: 140px; aspect-ratio: 16/9; border-radius: 4px;
    background: linear-gradient(135deg, #3a3f52, #23262f);
    display: block;
  }
  .watchlater-row-thumb.alt { background: linear-gradient(135deg, #4a3f2f, #23262f); }
  .watchlater-row-duration {
    position: absolute; bottom: 0.15rem; right: 0.15rem;
    background: rgba(0,0,0,0.7); color: #fff; font-size: 0.65rem;
    padding: 0.05rem 0.3rem; border-radius: 3px;
  }
  .watchlater-row-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.15rem; }
  .watchlater-row-title { font-weight: 600; }
  .watchlater-row-studio { font-size: 0.8rem; opacity: 0.7; }
  .watchlater-row-performers { font-size: 0.8rem; opacity: 0.85; }
  .watchlater-remove-btn {
    flex: 0 0 auto; font-size: 0.9rem; opacity: 0.6; background: none; border: none; color: inherit;
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="brand">Stash</div>
    <button class="icon-btn">⚲</button>
    <button class="icon-btn active" title="Watch Later">🔖</button>
  </div>

  <div class="section-label">Scenes — bookmark button on every card</div>
  <div class="grid">
    <div class="card">
      <div class="thumb-wrap">
        <div class="thumb"></div>
        <div class="watch-later-overlay">
          <button class="watch-later-btn watch-later-on">🔖</button>
        </div>
      </div>
      <div class="meta">Sample Scene A</div>
    </div>
    <div class="card">
      <div class="thumb-wrap">
        <div class="thumb alt"></div>
        <div class="watch-later-overlay">
          <button class="watch-later-btn">🔖</button>
        </div>
      </div>
      <div class="meta">Sample Scene B</div>
    </div>
    <div class="card">
      <div class="thumb-wrap">
        <div class="thumb alt3"></div>
        <div class="watch-later-overlay">
          <button class="watch-later-btn">🔖</button>
        </div>
      </div>
      <div class="meta">Sample Scene C</div>
    </div>
  </div>

  <div class="section-label">Dedicated Watch Later page</div>
  <div class="watchlater-page">
    <div class="watchlater-page-header">
      <h3>Watch Later (2)</h3>
      <a class="watchlater-kofi-link" href="#">☕ Buy me a coffee</a>
    </div>
    <div class="watchlater-list">
      <div class="watchlater-row">
        <div class="watchlater-row-thumb-link">
          <div class="watchlater-row-thumb"></div>
          <span class="watchlater-row-duration">24:10</span>
        </div>
        <div class="watchlater-row-body">
          <div class="watchlater-row-title">Sample Scene A</div>
          <div class="watchlater-row-studio">Demo Studio</div>
          <div class="watchlater-row-performers">Performer One, Performer Two</div>
        </div>
        <button class="watchlater-remove-btn">🗑</button>
      </div>
      <div class="watchlater-row">
        <div class="watchlater-row-thumb-link">
          <div class="watchlater-row-thumb alt"></div>
          <span class="watchlater-row-duration">8:42</span>
        </div>
        <div class="watchlater-row-body">
          <div class="watchlater-row-title">Sample Scene D</div>
          <div class="watchlater-row-studio">Another Studio</div>
          <div class="watchlater-row-performers">Performer Three</div>
        </div>
        <button class="watchlater-remove-btn">🗑</button>
      </div>
    </div>
  </div>

</body>
</html>
